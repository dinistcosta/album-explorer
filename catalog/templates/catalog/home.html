{% extends "base.html" %}
{% load i18n %}
{% block title %}Album Explorer{% endblock %}
{% block content %}
<section class="home-hero">
  <p class="label">{% translate "A museum of albums" %}</p>
  <h1>{% translate "Search for a band or an album" %}</h1>
  <form class="search" role="search" method="get">
    <input type="search" name="q" autocomplete="off" aria-label="{% translate 'Search for a band or an album' %}" placeholder="{% translate 'Search for a band or an album' %}">
    <button type="submit">{% translate "Search" %}</button>
  </form>
</section>
{% endblock %}
